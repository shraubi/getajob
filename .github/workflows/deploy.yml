name: Deploy

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy bot and Ralph to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -eu
            cd ${{ secrets.APP_DIR }}

            cleanup() {
              # Reclaim stopped containers, unused networks, and stale images.
              # Named/bind-mounted application data is deliberately preserved.
              docker system prune -af || true
              docker builder prune -af || true
              docker system df || true
            }
            on_exit() {
              code=$?
              trap - EXIT
              if [ "$code" -ne 0 ]; then
                echo "Delivery failed; safe container diagnostics follow."
                docker compose ps || true
                bot_id="$(docker compose ps -q bot || true)"
                if [ -n "$bot_id" ]; then
                  docker inspect --format \
                    'state={{.State.Status}} health={{.State.Health.Status}} restarts={{.RestartCount}}' \
                    "$bot_id" || true
                fi
              fi
              cleanup
              exit "$code"
            }
            trap on_exit EXIT

            deployed_since="$(date -u +%Y-%m-%dT%H:%M:%S+00:00)"
            git fetch origin main
            test "$(git rev-parse origin/main)" = "${{ github.sha }}"
            git reset --hard "${{ github.sha }}"

            # Release the previous deployment's images before rebuilding.
            # Bind-mounted application data is preserved by omitting --volumes.
            docker compose down --remove-orphans
            cleanup

            docker compose build --pull bot ralph
            # PLAYWRIGHT_BROWSERS_PATH is persisted in /app/storage, so remove
            # browser revisions left behind by previous Playwright releases.
            docker compose run --rm --no-deps bot python -m playwright uninstall --all || true
            docker compose run --rm --no-deps bot python -m playwright install --only-shell chromium
            docker compose up -d --wait --wait-timeout 90 bot ralph

            # The bot becomes healthy only after Telegram accepts its token and
            # the polling application finishes initialization.
            docker compose ps
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
            bot_id="$(docker compose ps -q bot)"
            test -n "$bot_id"
            test "$(docker inspect --format '{{.State.Running}}' "$bot_id")" = "true"
            test "$(docker inspect --format '{{.RestartCount}}' "$bot_id")" = "0"
            test "$(docker inspect --format '{{.State.Health.Status}}' "$bot_id")" = "healthy"
            # A real user-session message proves Telegram polling and reply delivery.
            docker compose exec -T bot python scripts/acceptance_telegram.py
            # Application evidence is assessed separately; deploy allows a fresh waiting state.
            docker compose exec -T bot python scripts/acceptance_report.py \
              --db /app/storage/jobs.db --since "$deployed_since" --allow-waiting
