name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy bot and Ralph to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -eu
            cd ${{ secrets.APP_DIR }}
            git fetch origin main
            git reset --hard origin/main
            docker image prune -af
            docker builder prune -af --keep-storage 1GB
            docker compose build --pull bot ralph
            docker compose run --rm --no-deps bot python -m playwright install --only-shell chromium
            docker compose up -d bot ralph
            docker image prune -af
