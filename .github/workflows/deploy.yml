name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy bot and Ralph to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -eu
            cd ${{ secrets.APP_DIR }}

            cleanup() {
              # Reclaim stopped containers, unused networks, and stale images.
              # Named/bind-mounted application data is deliberately preserved.
              docker system prune -af || true
              docker builder prune -af || true
              docker system df || true
            }
            trap cleanup EXIT

            git fetch origin main
            git reset --hard origin/main

            # Release the previous deployment's images before rebuilding.
            # Bind-mounted application data is preserved by omitting --volumes.
            docker compose down --remove-orphans
            cleanup

            docker compose build --pull bot ralph
            # PLAYWRIGHT_BROWSERS_PATH is persisted in /app/storage, so remove
            # browser revisions left behind by previous Playwright releases.
            docker compose run --rm --no-deps bot python -m playwright uninstall --all || true
            # ATS automation is headed under Xvfb, so it needs the full browser,
            # not Playwright's headless-only shell.
            docker compose run --rm --no-deps bot python -m playwright install chromium
            docker compose up -d --wait --wait-timeout 45 bot ralph

            # The bot becomes healthy only after Telegram accepts its token and
            # the polling application finishes initialization.
            docker compose ps
            docker compose logs --no-color --tail=100 bot
            bot_id="$(docker compose ps -q bot)"
            test -n "$bot_id"
            test "$(docker inspect --format '{{.State.Running}}' "$bot_id")" = "true"
            test "$(docker inspect --format '{{.RestartCount}}' "$bot_id")" = "0"
            test "$(docker inspect --format '{{.State.Health.Status}}' "$bot_id")" = "healthy"
