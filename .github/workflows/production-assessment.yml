name: Application delivery evidence

on:
  workflow_run:
    workflows: ["Delivery"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  assess:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Inspect deployed release and HelloWork outcomes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -eu
            cd ${{ secrets.APP_DIR }}
            git fetch origin main
            deployed_sha="$(git rev-parse HEAD)"
            current_sha="$(git rev-parse origin/main)"
            echo "deployed_sha=$deployed_sha current_sha=$current_sha"
            release_status=stale
            if [ "$deployed_sha" = "$current_sha" ]; then release_status=current; fi
            docker compose ps
            bot_id="$(docker compose ps -q bot || true)"
            bot_health=missing
            if [ -n "$bot_id" ]; then
              bot_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}unknown{{end}}' "$bot_id" || echo unknown)"
            fi
            assessment_status=1
            if [ -n "$bot_id" ] && [ "$bot_health" = healthy ]; then
              assessment_status=0
              docker compose exec -T bot python -m scripts.acceptance_report \
                --db /app/storage/jobs.db || assessment_status=$?
            fi
            # A one-off container can report even when the long-running bot is unhealthy.
            docker compose run --rm --no-deps bot python -m scripts.assessment_telegram \
              --db /app/storage/jobs.db \
              --state /app/storage/assessment-telegram.json \
              --bot-health "$bot_health" --release-status "$release_status"
            test "$release_status" = current
            test -n "$bot_id"
            test "$bot_health" = healthy
            test "$assessment_status" = 0

