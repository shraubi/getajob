name: Delivery

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Check acceptance probes import from repository root
        run: |
          python -m scripts.acceptance_report --help > /dev/null
          python -c "import scripts.acceptance_telegram"
      - name: Validate production Compose configuration
        run: |
          touch .env
          docker compose config --quiet

  deploy:
    if: github.event_name != 'pull_request'
    needs: unit
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
