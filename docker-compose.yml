services:
  hirify-auth:
    image: mcr.microsoft.com/playwright/python:v1.55.0-noble
    profiles: ["tools"]
    working_dir: /app
    env_file: .env
    command: python scripts/auth_hirify.py
    volumes:
      - .:/app:ro
      - ${DATA_DIR:-./storage}:/app/storage

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      RESUME_DIR: /app/data/resumes
      JOBS_DB_PATH: /app/storage/jobs.db
    volumes:
      - ${CV_FILE:-./cv/base_cv.txt}:/app/cv/base_cv.txt:ro
      - ${RESUME_HOST_DIR:-./data/resumes}:/app/data/resumes:ro
      - ${DATA_DIR:-./storage}:/app/storage
